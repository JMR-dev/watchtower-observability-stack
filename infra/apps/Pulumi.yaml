name: watchtower-apps
runtime:
  name: go
  options:
    # Built before any pulumi command: `go build -o bin/apps ./apps` from
    # infra/ (CI does the same).
    binary: ../bin/apps
description: |
  Everything inside the Kubespray cluster: hcloud-csi (LUKS volumes), kured,
  Loki, Mimir, Tempo, Grafana, the edge pod (wg-easy + Caddy/Coraza), fipd,
  the Fluent Bit log archive and the Cilium network policies. The cluster is
  KUBECONFIG; nothing about it is stored in state.
backend:
  # Same bucket as ../cloud. Credentials: AWS_ACCESS_KEY_ID /
  # AWS_SECRET_ACCESS_KEY (the admin S3 key).
  url: s3://jmr-watchtower-pulumi-state?endpoint=nbg1.your-objectstorage.com&region=nbg1&s3ForcePathStyle=true
config:
  pulumi:disable-default-providers:
    value: ["*"]
