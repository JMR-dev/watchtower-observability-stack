# Fluent Bit: every container log, every node's journal and the API server
# audit log, to the log-archive bucket (90-day lifecycle) on Hetzner Object
# Storage. ${...} values come from the DaemonSet's environment.
#
# use_put_object: one PUT per chunk. The archive key is write-only (bucket
# policy) and may not run multipart uploads, so this is required.
#
# retry_limit: the S3 plugin caps "no_limits" at 5 attempts (about 30 s of
# linear backoff), then quarantines the chunk on disk and never sends it. 300
# attempts at 2 s more each ride out about a day of S3 outage.
# store_dir_limit_size: the buffer for that outage, bounded so it cannot fill
# the node's disk and set off kubelet evictions.

[SERVICE]
    Flush                     5
    Daemon                    Off
    Log_Level                 info
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Health_Check              On
    storage.path              /var/lib/fluent-bit/storage
    storage.sync              normal
    storage.backlog.mem_limit 16M

[INPUT]
    Name              tail
    Tag               containers.*
    Path              /var/log/containers/*.log
    multiline.parser  cri
    DB                /var/lib/fluent-bit/containers.db
    Mem_Buf_Limit     32MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    storage.type      filesystem

[INPUT]
    Name              systemd
    Tag               journal.*
    Path              /var/log/journal
    DB                /var/lib/fluent-bit/journal.db
    Strip_Underscores On
    storage.type      filesystem

[INPUT]
    Name              tail
    Tag               audit.*
    Path              /var/log/audit/kube-apiserver-audit.log
    DB                /var/lib/fluent-bit/audit.db
    Mem_Buf_Limit     16MB
    storage.type      filesystem

[FILTER]
    Name                kubernetes
    Match               containers.*
    Kube_Tag_Prefix     containers.var.log.containers.
    Merge_Log           Off
    Labels              On
    Annotations         Off

[FILTER]
    Name    record_modifier
    Match   *
    Record  node ${NODE_NAME}

[OUTPUT]
    Name              s3
    Match             containers.*
    bucket            ${S3_BUCKET}
    region            ${S3_REGION}
    endpoint          https://${S3_ENDPOINT}
    use_put_object    On
    compression       gzip
    total_file_size   50M
    upload_timeout    5m
    store_dir         /var/lib/fluent-bit/s3-containers
    s3_key_format     /containers/%Y/%m/%d/%H/${NODE_NAME}-%M%S-$UUID.gz
    retry_limit       300
    store_dir_limit_size 5G

[OUTPUT]
    Name              s3
    Match             journal.*
    bucket            ${S3_BUCKET}
    region            ${S3_REGION}
    endpoint          https://${S3_ENDPOINT}
    use_put_object    On
    compression       gzip
    total_file_size   50M
    upload_timeout    5m
    store_dir         /var/lib/fluent-bit/s3-journal
    s3_key_format     /journal/%Y/%m/%d/%H/${NODE_NAME}-%M%S-$UUID.gz
    retry_limit       300
    store_dir_limit_size 5G

[OUTPUT]
    Name              s3
    Match             audit.*
    bucket            ${S3_BUCKET}
    region            ${S3_REGION}
    endpoint          https://${S3_ENDPOINT}
    use_put_object    On
    compression       gzip
    total_file_size   50M
    upload_timeout    5m
    store_dir         /var/lib/fluent-bit/s3-audit
    s3_key_format     /audit/%Y/%m/%d/%H/${NODE_NAME}-%M%S-$UUID.gz
    retry_limit       300
    store_dir_limit_size 5G
