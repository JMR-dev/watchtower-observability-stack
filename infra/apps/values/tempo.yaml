# grafana-community/tempo: Tempo 3 single binary (live-store, backend
# scheduler and worker in one process; no Kafka). The bucket name and the S3
# credential Secret are merged in by tempo.go.
tempo:
  tag: 3.1.1
  multitenancyEnabled: true
  reportingEnabled: false
  retention: 720h
  receivers:
    # The chart's templates require the Jaeger receivers to stay defined;
    # they are reachable only in-cluster. Caddy exposes OTLP (4317, 4318).
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  storage:
    trace:
      backend: s3
      s3:
        endpoint: nbg1.your-objectstorage.com
        region: nbg1
        forcepathstyle: true
        insecure: false
      wal:
        path: /var/tempo/wal
  metricsGenerator:
    enabled: true
    registry:
      external_labels:
        source: tempo
        cluster: watchtower
    storage:
      path: /var/tempo/generator/wal
      remote_write:
        - url: http://mimir.watchtower.svc.cluster.local:8080/api/v1/push
          send_exemplars: true
  overrides:
    defaults:
      metrics_generator:
        processors: [service-graphs, span-metrics]
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for the Tempo S3 key.
  extraEnvFrom:
    - secretRef:
        name: tempo-s3
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

persistence:
  enabled: true
  size: 20Gi
  storageClassName: hcloud-luks
