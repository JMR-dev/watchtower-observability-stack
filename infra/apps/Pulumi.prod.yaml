# Production stack. Public values only: the repo is mirrored publicly, and
# every secret the workloads get is read from Secret Manager in gcpProject at
# deploy time (scripts/secret-names.txt). caddyImage and fipdImage are set by
# the deploy workflow to the digests it just built; they are not committed.
config:
  # Must match ../cloud/Pulumi.prod.yaml.
  watchtower:bucketPrefix: jmr-watchtower
  watchtower:registryUser: JMR-dev
  watchtower:lokiIngesters: "3"
  watchtower:lokiReplicationFactor: "3"
  watchtower:tenants:
    - slug: default
      orgName: Default
  watchtower:gcpProject: watchtower-observe
