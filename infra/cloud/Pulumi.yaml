name: watchtower-cloud
runtime:
  name: go
  options:
    # Built before any pulumi command: `go build -o bin/cloud ./cloud` from
    # infra/ (CI does the same).
    binary: ../bin/cloud
description: |
  Hetzner side of the watchtower stack: private network, nodes, firewall, VPN
  Floating IP, telemetry and log-archive buckets, plus the records in the
  Cloud DNS zone watchtower.jasonmross.dev. Kubernetes itself is Kubespray
  (../../ansible); everything inside the cluster is ../apps.
backend:
  # Hetzner Object Storage, a bucket of its own made by scripts/bootstrap.sh.
  # Credentials: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (the admin S3 key).
  url: s3://jmr-watchtower-pulumi-state?endpoint=nbg1.your-objectstorage.com&region=nbg1&s3ForcePathStyle=true
config:
  # Every provider is explicit. A resource that forgot its provider would
  # otherwise fall through to a default one configured from whatever is in
  # the environment.
  pulumi:disable-default-providers:
    value: ["*"]
