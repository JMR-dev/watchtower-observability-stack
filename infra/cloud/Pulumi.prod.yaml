# Production stack. Public values only: the repo is mirrored publicly, and
# every secret (the S3 access key IDs the bucket policies name included) is
# read from Secret Manager at deploy time (docs/required-secrets.md).
# `pulumi stack init prod --secrets-provider passphrase` adds encryptionsalt.
config:
  # Falkenstein: the one location with cax31 capacity (2026-10-25). Object
  # Storage is here too (internal/names S3Endpoint).
  watchtower:location: fsn1
  watchtower:networkZone: eu-central
  # 3 ARM nodes (8 vCPU each) and an ARM proxy (2 vCPU): exactly the
  # account's 26-vCPU cap, so servers are replaced delete-first.
  watchtower:nodeServerType: cax31
  watchtower:proxyServerType: cax11
  watchtower:image: alma-10
  watchtower:nodeCount: "3"
  watchtower:nodeVolumeGb: "30"
  watchtower:proxyVolumeGb: "10"
  watchtower:deleteProtection: "true"
  # Must be unique per Hetzner location across all customers.
  watchtower:bucketPrefix: jmr-watchtower
  # The S3 owner ID is p16527471; bucket policies name p<id>:<access key>.
  watchtower:hetznerProjectId: "16527471"
  watchtower:sshPublicKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPX/IQoTXtMZyyx0ltlnDX13AYOABb6frfb+pdG6eUL6"
  # The only public SSH: the deploy, from the Gitea Actions runners' Cloud
  # NAT address (gitea-496920, gitea-runners-egress-ip), to the proxy. People
  # SSH in over the WireGuard VPN.
  watchtower:ciCidrs:
    - 34.26.149.196/32
  watchtower:wireguardAllowCidrs:
    - 0.0.0.0/0
    - ::/0
  # Holds the DNS zone, the image registry and the secrets.
  watchtower:gcpProject: watchtower-observe
  watchtower:dnsZone: watchtower
encryptionsalt: v1:IURg/P90chM=:v1:KOUOy+cy4hDhux6J:ck7o2LiYSp9jmmkQMqH/M1ZPJY/oAw==
