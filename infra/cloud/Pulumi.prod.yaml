# Production stack. Public values only, except the access key IDs, which are
# set with `pulumi config set --secret --path` (the repo is mirrored publicly).
# `pulumi stack init prod --secrets-provider passphrase` adds encryptionsalt.
config:
  watchtower:location: nbg1
  watchtower:networkZone: eu-central
  watchtower:serverType: cpx42
  watchtower:image: alma-10
  # 1-3 carry the control plane and etcd; more are workers (scale.yml).
  watchtower:nodeCount: "3"
  watchtower:deleteProtection: "true"
  # Must be unique per Hetzner location across all customers.
  watchtower:bucketPrefix: jmr-watchtower
  # Console URL: https://console.hetzner.com/projects/<id>/servers
  watchtower:hetznerProjectId: "REPLACE_WITH_PROJECT_ID"
  watchtower:sshPublicKey: "REPLACE_WITH_ssh-ed25519_PUBLIC_KEY"
  # SSH and the Kubernetes API. Tighten to your own egress addresses.
  watchtower:adminCidrs:
    - 0.0.0.0/0
    - ::/0
  # The Gitea Actions runners' Cloud NAT address (gitea-496920,
  # gitea-runners-egress-ip).
  watchtower:ciCidrs:
    - 34.26.149.196/32
  watchtower:wireguardAllowCidrs:
    - 0.0.0.0/0
    - ::/0
  watchtower:gcpProject: watchtower-observe
  watchtower:dnsZone: watchtower
  # pulumi config set --secret --path 'watchtower:s3AccessKeys.admin' <id>
  # (and .loki, .mimir, .tempo, .logship)
