#cloud-config
# Minimal bootstrap: python3 for Ansible and SSH hardening. Everything else,
# podman and every container included, is Ansible (ansible/playbooks/site.yml).
# Pulumi ignores later changes to this file: it only runs on first boot.

package_update: true
package_upgrade: true

packages:
  - python3
  - python3-libselinux
  - dnf-plugins-core

ssh_pwauth: false
disable_root: false

# The host key is generated by Pulumi (pulumi-tls), so its public half is
# known before the server boots: Ansible connects with strict host key
# checking against the knownHosts stack output, never trust-on-first-use.
ssh_deletekeys: true
ssh_genkeytypes: []
ssh_keys:
  ed25519_private: |
{{HOST_KEY_PRIVATE}}
  ed25519_public: {{HOST_KEY_PUBLIC}}

write_files:
  - path: /etc/ssh/sshd_config.d/10-watchtower.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      PermitRootLogin prohibit-password
      PubkeyAuthentication yes
      KbdInteractiveAuthentication no

runcmd:
  - systemctl restart sshd
