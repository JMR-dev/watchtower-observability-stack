#!/usr/sbin/nft -f
# The break-glass bastion's /etc/nftables.conf: config/bastion/startup.sh
# puts it there from the VM's metadata, and Debian's nftables.service loads
# it at every boot, before the network comes up.
#
# The metadata server hands any process that asks the VM's token, and that
# token reads the bastion's agent peer (docs/client-telemetry.md). So only
# root may reach it, but for DNS, DHCP and NTP: every process resolves names
# there, systemd-networkd renews its lease with it as its own uid (a refused
# renewal loses the VM's address, and with it break glass), and chrony keeps
# time with it, and none carries a credential. Everyone else who logs in
# through OS Login, the deployer among them, is refused at once rather than
# left to time out.
#
# That includes a non-root process looking up an OS Login user who isn't in the
# VM's cache yet: it asks the metadata server, is refused, and gets "no such user",
# at once. sshd, sudo, logind and PID 1 look up as root, so logging in still works.
# Don't open the guard for it (docs/runbook.md, "Break glass").
#
# meta skuid is the uid that opened the socket. A packet with no socket
# behind it (a reset, a TIME_WAIT ack) matches no skuid and passes; it
# carries nothing. Nothing else is filtered: GCE's firewall admits SSH from
# IAP only. scripts/check-bastion.sh loads this in Debian 13 and checks who
# gets through. A new version of this file goes on under a 10-minute rollback
# (config/bastion/ruleset.sh).

table inet metadata_guard
delete table inet metadata_guard

table inet metadata_guard {
	chain output {
		type filter hook output priority filter; policy accept;
		# The metadata server, and its address on IPv6 networks.
		ip daddr 169.254.169.254 jump metadata
		ip6 daddr fd20:ce::254 jump metadata
	}

	chain metadata {
		udp dport { 53, 67, 123 } accept
		tcp dport 53 accept
		meta skuid != 0 counter reject with icmpx admin-prohibited
	}
}
