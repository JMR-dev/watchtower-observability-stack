---
# Everything on the hosts, from a fresh server to a running stack, and every
# deploy after that. The deploy workflow runs it with the image digests it
# just pushed or found (their tags, scripts/image-tag.sh) and the secrets in
# its environment.
#
#   scripts/image-tag.sh --vars >image-tags.json
#   ansible-playbook playbooks/site.yml -e @image-tags.json

- name: Check the deploy's inputs
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Every secret is in the environment
      ansible.builtin.assert:
        that: watchtower_secret[item] | length > 0
        fail_msg: "{{ item }} is empty: the deploy reads every secret from Secret Manager (docs/required-secrets.md)"
        quiet: true
      loop: "{{ watchtower_secret.keys() | list }}"
      no_log: true

    - name: Every one of our images has a tag
      ansible.builtin.assert:
        that: watchtower_image_tags[item] | default('') | length > 0
        fail_msg: "no tag for {{ item }}: pass -e @image-tags.json from scripts/image-tag.sh --vars (the deploy does)"
        quiet: true
      # Every build/<name>/.
      loop: "{{ lookup('ansible.builtin.pipe', playbook_dir ~ '/../../scripts/image-tag.sh --names').splitlines() }}"

- name: Host baseline, firewall, mesh and storage
  hosts: proxy:nodes
  roles:
    - base
    - firewall
    - fail2ban
    - mesh
    - storage
    - registry
    - logship
    - reboot

# Until the cluster has passed its health gate once, every node goes at once:
# etcd and Kafka need a quorum before any member reports ready, and a first
# deploy that failed partway is finished the same way. After that, one node
# at a time, each checked healthy before the next, so the cluster never loses
# more than one. A node that passes the gate leaves a marker.
- name: Decide how to roll the nodes
  hosts: nodes
  gather_facts: false
  tasks:
    - name: Has this node passed the health gate before?
      ansible.builtin.stat:
        path: "{{ watchtower_config }}/healthy-once"
      register: watchtower_healthy_once

    - name: Pick the batch size
      ansible.builtin.set_fact:
        watchtower_node_serial: >-
          {{ groups['nodes'] | length
             if groups['nodes'] | map('extract', hostvars, 'watchtower_healthy_once') | map(attribute='stat.exists') | select | list | length == 0
             else 1 }}
      run_once: true
      delegate_to: "{{ groups['nodes'][0] }}"
      delegate_facts: true

- name: Data nodes
  hosts: nodes
  serial: "{{ hostvars[groups['nodes'][0]]['watchtower_node_serial'] | default(1) }}"
  roles:
    - etcd
    - patroni
    - kafka
    - loki
    - mimir
    - tempo
    - grafana
    # After grafana, which creates the database it dumps.
    - pgbackup
    # Last: a node starts reporting once everything on it is installed.
    - health
  post_tasks:
    - name: This node is healthy before the next one goes
      ansible.builtin.include_tasks: tasks/node-health.yml

    - name: Remember that it was
      ansible.builtin.copy:
        content: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}\n"
        dest: "{{ watchtower_config }}/healthy-once"
        mode: "0644"
        force: false

- name: Proxy
  hosts: proxy
  roles:
    - edge
    - health
