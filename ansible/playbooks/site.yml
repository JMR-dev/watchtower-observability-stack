---
# Everything, in order: node baseline, the Kubernetes cluster (Kubespray's
# cluster.yml), the kubeconfig. The deploy workflow runs the three parts
# separately so Kubespray only runs when its inputs change.
#
#   cd ansible && ansible-playbook playbooks/site.yml
- name: Node baseline
  ansible.builtin.import_playbook: prepare.yml

- name: Kubernetes (Kubespray)
  ansible.builtin.import_playbook: kubernetes_sigs.kubespray.cluster

- name: Admin kubeconfig
  ansible.builtin.import_playbook: kubeconfig.yml
