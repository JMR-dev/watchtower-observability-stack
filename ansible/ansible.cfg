[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = .collections
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
forks = 10
interpreter_python = /usr/bin/python3
# Keeps a failed run's facts reusable for the rerun.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .facts_cache
fact_caching_timeout = 7200

[ssh_connection]
pipelining = True
# Every host by its inventory name, through the SSH config
# scripts/ssh-config.sh writes (the way to the proxy, the jump to the nodes,
# the key). Host keys are generated by the cloud stack and pinned there
# (inventory/known_hosts, `pulumi stack output knownHosts`): no
# trust-on-first-use.
ssh_args = -F inventory/ssh_config -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes
