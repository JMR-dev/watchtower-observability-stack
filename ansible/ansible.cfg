[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = .collections
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
forks = 10
interpreter_python = /usr/bin/python3
# Kubespray's playbooks are long; this keeps a failed run's facts reusable.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .facts_cache
fact_caching_timeout = 7200

[ssh_connection]
pipelining = True
# Host keys are generated by the cloud stack and pinned: inventory/known_hosts
# is `pulumi stack output knownHosts`. No trust-on-first-use.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=inventory/known_hosts
