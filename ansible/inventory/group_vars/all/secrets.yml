---
# Secret values, read on the controller from the environment the deploy
# workflow's setup step fills from Secret Manager (docs/required-secrets.md).
# Single-line values arrive as variables; multi-line ones (JSON keys) as the
# path of a 0600 file. Nothing here is evaluated until a task uses it, so
# syntax checks and the CI render run without them.
watchtower_secret:
  s3_cluster_access_key: "{{ lookup('ansible.builtin.env', 'S3_CLUSTER_ACCESS_KEY') }}"
  s3_cluster_secret_key: "{{ lookup('ansible.builtin.env', 'S3_CLUSTER_SECRET_KEY') }}"
  luks_passphrase: "{{ lookup('ansible.builtin.env', 'LUKS_PASSPHRASE') }}"
  grafana_admin_password: "{{ lookup('ansible.builtin.env', 'GRAFANA_ADMIN_PASSWORD') }}"
  grafana_secret_key: "{{ lookup('ansible.builtin.env', 'GRAFANA_SECRET_KEY') }}"
  grafana_db_password: "{{ lookup('ansible.builtin.env', 'GRAFANA_DB_PASSWORD') }}"
  postgres_superuser_password: "{{ lookup('ansible.builtin.env', 'POSTGRES_SUPERUSER_PASSWORD') }}"
  postgres_replication_password: "{{ lookup('ansible.builtin.env', 'POSTGRES_REPLICATION_PASSWORD') }}"
  patroni_restapi_password: "{{ lookup('ansible.builtin.env', 'PATRONI_RESTAPI_PASSWORD') }}"
  wg_easy_password: "{{ lookup('ansible.builtin.env', 'WG_EASY_PASSWORD') }}"
  healthchecks_pg_backup_url: "{{ lookup('ansible.builtin.env', 'HEALTHCHECKS_PG_BACKUP_URL') }}"
  # One JSON object, host name to ping URL (scripts/healthchecks.sh).
  healthchecks_host_urls: "{{ lookup('ansible.builtin.env', 'HEALTHCHECKS_HOST_URLS') }}"
  caddy_dns_key: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'CADDY_DNS_KEY_FILE')) }}"
  gar_pull_key: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'GAR_PULL_KEY_FILE')) }}"
