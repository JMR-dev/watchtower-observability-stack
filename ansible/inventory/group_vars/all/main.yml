---
# Host-wide settings. Every name the cloud stack owns (buckets, addresses,
# CIDRs, retention) arrives in the inventory instead (`pulumi stack output
# inventory`); nothing here repeats one.

timezone: Etc/UTC

# How Ansible reaches the hosts: by their inventory names, through the SSH
# config scripts/ssh-config.sh writes (inventory/ssh_config; ansible.cfg
# passes it with -F). It picks the way to the proxy, public, vpn or bastion;
# the nodes are always reached through the proxy, on their private
# addresses.

# Addresses fail2ban never bans: loopback, the deploy runners and the
# break-glass bastion (a ban would lock out the deploy, or break glass) and,
# on the nodes, the proxy, which every SSH session to a node comes through.
fail2ban_ignoreip: >-
  {{ ['127.0.0.1/8', '::1'] + watchtower_ci_cidrs + watchtower_break_glass_cidrs
     + (groups['proxy'] | map('extract', hostvars, 'private_ip') | list if 'nodes' in group_names else []) }}

# The LUKS volume (roles/storage) is mounted here; every service keeps its
# state in a directory of its own below it.
watchtower_data: /srv/watchtower
# Rendered configs, one directory per service.
watchtower_config: /etc/watchtower

# Node mesh IPs in inventory order, and the same list with this host's own
# address first: Go's dialer tries /etc/hosts addresses in order, so a
# container reaches its local copy of a service first and moves on to the
# others when it is down.
watchtower_node_ips: "{{ groups['nodes'] | map('extract', hostvars, 'mesh_ip') | list }}"
watchtower_node_ips_local_first: >-
  {{ ([mesh_ip] if mesh_ip in watchtower_node_ips else []) + (watchtower_node_ips | reject('equalto', mesh_ip) | list) }}
