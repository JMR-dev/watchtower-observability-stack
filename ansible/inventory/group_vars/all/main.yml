---
# Node preparation (roles base, fail2ban, floating_ip). Kubespray's own
# settings live in kubespray.yml (all hosts) and ../k8s_cluster/.

timezone: Etc/UTC

# Addresses fail2ban never bans: the Gitea Actions runners' egress (a ban
# would break every deploy) and loopback. Add your own.
fail2ban_ignoreip:
  - 127.0.0.1/8
  - "::1"
  - 34.26.149.196/32

# watchtower_floating_ipv4 comes from the inventory (cloud stack output).
