---
# Every image the hosts run. Upstream images are pinned to the multi-arch
# index digest of the tag (every host is arm64; CI's checks run some of them
# on amd64). Bump the tag and the digest together:
#   skopeo inspect --raw docker://<image>:<tag> | sha256sum
# Our own images (build/<name>/) come from Artifact Registry by their tags,
# further down.
watchtower_images:
  loki: docker.io/grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
  mimir: docker.io/grafana/mimir:3.2.3@sha256:0ed56db7d7713707eff00224ddd4c3096afa6cf1cbe43a6f9391c537f1416099
  tempo: docker.io/grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
  grafana: docker.io/grafana/grafana:13.2.4-distroless@sha256:ae3d3add290adbe6a88412229f5d76fd7bb82743050881698642d3d62f277e35
  fluentbit: cr.fluentbit.io/fluent/fluent-bit:5.1.5@sha256:2740f387f6e68fab66d28e4fa6a853387b9cab6ffb4cb78958f69bba4eb0e7b4
  wg_easy: "{{ watchtower_own_image_repo }}/wg-easy:{{ watchtower_image_tags['wg-easy'] | default('unset') }}"
  kafka: docker.io/apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
  # 3.6, not 3.7: Patroni is confirmed on etcd 3.6, not yet on 3.7.
  etcd: quay.io/coreos/etcd:v3.6.16@sha256:a9c7cc12156f4b26ca41f0b57ba5b76c45037ff6c1e47ea3d68cb7908d48a965

# Artifact Registry, where our own images live. The hosts log in with
# gar-pull-key (roles/registry), and pull these with --authfile.
watchtower_registry: europe-west3-docker.pkg.dev
watchtower_own_image_repo: "{{ watchtower_registry }}/watchtower-observe/watchtower"

# Our images' tags, {name: tag}: each a hash of build/<name>/
# (scripts/image-tag.sh). The deploy passes them all, the ones its images
# jobs just pushed or found there:
#   scripts/image-tag.sh --vars >image-tags.json
#   ansible-playbook playbooks/site.yml -e @image-tags.json
# Tags in the repo are immutable, so a tag is as exact as a digest.
# site.yml refuses to run without a tag for every image.
watchtower_image_tags: {}
caddy_image: "{{ watchtower_own_image_repo }}/caddy:{{ watchtower_image_tags['caddy'] | default('unset') }}"
patroni_image: "{{ watchtower_own_image_repo }}/patroni:{{ watchtower_image_tags['patroni'] | default('unset') }}"
