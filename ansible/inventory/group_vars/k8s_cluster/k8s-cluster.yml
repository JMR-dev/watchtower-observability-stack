---
# The newest Kubernetes Kubespray v2.32.0 supports.
kube_version: 1.36.4
container_manager: containerd
kube_network_plugin: cilium

# Secrets encrypted at rest in etcd.
kube_encrypt_secret_data: true

# API server audit log, shipped to the log archive by Fluent Bit.
kubernetes_audit: true
audit_log_path: /var/log/audit/kube-apiserver-audit.log
audit_log_maxage: 7
audit_log_maxbackups: 5
audit_log_maxsize: 100

auto_renew_certificates: true

# The API certificate also covers the public name the deploy workflow and
# operators use, and the nodes' public addresses behind it.
supplementary_addresses_in_ssl_keys: >-
  {{ ['api.watchtower.jasonmross.dev']
     + (groups['kube_control_plane'] | map('extract', hostvars, 'watchtower_public_ipv4') | list) }}

# Ansible fetches the admin kubeconfig itself (playbooks/kubeconfig.yml).
kubeconfig_localhost: false

# Needed by the Loki HPAs.
metrics_server_enabled: true

# Nothing in the cluster is exposed through an ingress controller or a cloud
# load balancer; the edge pod uses a hostPort.
ingress_nginx_enabled: false
