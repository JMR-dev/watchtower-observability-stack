---
# SSH to a node: its private address, through the proxy. The nodes take no
# SSH on their public addresses, and only the proxy's private address may
# reach theirs (roles/firewall). The private network, not the mesh: wg1 does
# not exist until the first deploy has made it.
ansible_host: "{{ private_ip }}"
# The jump's ssh gets the same key and pinned host keys as Ansible's own
# (ansible.cfg ssh_args); the key from ANSIBLE_PRIVATE_KEY_FILE when set (the
# deploy), else from ssh-agent (scripts/env.sh).
ansible_ssh_common_args: >-
  -o ProxyCommand="ssh -q -W %h:%p -o BatchMode=yes -o IdentitiesOnly=yes
  -o StrictHostKeyChecking=yes -o UserKnownHostsFile=inventory/known_hosts
  {{ ('-i ' ~ lookup('ansible.builtin.env', 'ANSIBLE_PRIVATE_KEY_FILE')) if lookup('ansible.builtin.env', 'ANSIBLE_PRIVATE_KEY_FILE') else '' }}
  root@{{ hostvars[groups['proxy'][0]].ansible_host }}"
