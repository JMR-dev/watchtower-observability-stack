---
# Shape of the inventory the cloud stack exports (`pulumi stack output
# inventory`), with documentation addresses. CI's syntax checks and config
# render use it.
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    watchtower_break_glass_cidrs: [192.0.2.53/32, "2001:db8::53/128"]
    watchtower_bastion: {name: watchtower-bastion, zone: us-east1-b, project: watchtower-observe, host_key: ssh-ed25519 sample-not-a-key}
    watchtower_wireguard_cidrs: [0.0.0.0/0, "::/0"]
    watchtower_wireguard_port: 51820
    watchtower_private_cidr: 10.20.1.0/24
    watchtower_mesh_cidr: 10.30.0.0/24
    watchtower_mesh_port: 51830
    watchtower_domain: watchtower.jasonmross.dev
    watchtower_vpn_host: vpn.watchtower.jasonmross.dev
    watchtower_tunnel_ip: 10.8.0.1
    watchtower_tunnel_cidr: 10.8.0.0/24
    watchtower_gcp_project: watchtower-observe
    watchtower_admin_cidr: 10.8.0.0/25
    watchtower_agent_cidr: 10.8.0.128/25
    watchtower_agent_tenant: jasonmross
    watchtower_agent_peers:
      - {name: bastion, secret: wireguard-bastion-peer, address: 10.8.0.129}
      - {name: gitea-vm, secret: wireguard-gitea-vm-peer, address: 10.8.0.130}
      - {name: vaultwarden-production, secret: wireguard-vaultwarden-production-peer, address: 10.8.0.131}
      - {name: vaultwarden-disposable, secret: wireguard-vaultwarden-disposable-peer, address: 10.8.0.132}
      - {name: silverbullet-vm, secret: wireguard-silverbullet-vm-peer, address: 10.8.0.133}
      - {name: blog-vm, secret: wireguard-blog-vm-peer, address: 10.8.0.134}
    watchtower_s3_endpoint: fsn1.your-objectstorage.com
    watchtower_s3_region: fsn1
    watchtower_buckets:
      loki: jmr-watchtower-loki
      mimir-blocks: jmr-watchtower-mimir-blocks
      mimir-ruler: jmr-watchtower-mimir-ruler
      mimir-alertmanager: jmr-watchtower-mimir-alertmanager
      tempo: jmr-watchtower-tempo
      logs-archive: jmr-watchtower-logs-archive
      postgres-backups: jmr-watchtower-postgres-backups
    watchtower_archive_prefixes: {containers: containers/, journal: journal/, audit: audit/}
    watchtower_postgres_backup_prefix: grafana/
    watchtower_retention_days: {loki: 30, mimir: 90, tempo: 30, log_archive: 90, postgres_backup: 90}
  children:
    proxy:
      hosts:
        watchtower-proxy: {public_ip: 198.51.100.7, private_ip: 10.20.1.10, mesh_ip: 10.30.0.10, volume_id: 100}
    nodes:
      hosts:
        watchtower-1: {public_ip: 203.0.113.11, private_ip: 10.20.1.11, mesh_ip: 10.30.0.11, volume_id: 101, node_index: 1, zone: a}
        watchtower-2: {public_ip: 203.0.113.12, private_ip: 10.20.1.12, mesh_ip: 10.30.0.12, volume_id: 102, node_index: 2, zone: b}
        watchtower-3: {public_ip: 203.0.113.13, private_ip: 10.20.1.13, mesh_ip: 10.30.0.13, volume_id: 103, node_index: 3, zone: c}
