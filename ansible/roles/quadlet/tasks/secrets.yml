---
# Create or replace podman secrets, only when their value changed, and report
# whether any did (quadlet_secrets_changed) so the caller can restart its
# containers. Input: quadlet_secrets, a list of {name, value}.
#
# Each secret carries a sha256 label of its value; comparing labels keeps a
# deploy from recreating, and restarting, everything every time. Values reach
# podman on stdin, never on a command line.

- name: Read the secrets' recorded checksums
  ansible.builtin.command:
    argv: [podman, secret, inspect, --format, "{{ '{{' }} index .Spec.Labels \"sha256\" {{ '}}' }}", "{{ item.name }}"]
  loop: "{{ quadlet_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  register: quadlet_secret_sums
  changed_when: false
  failed_when: false

- name: Create or replace the secrets that changed
  ansible.builtin.command:
    argv: [podman, secret, create, --replace, --label, "sha256={{ item.0.value | hash('sha256') }}", "{{ item.0.name }}", "-"]
    stdin: "{{ item.0.value }}"
    stdin_add_newline: false
  loop: "{{ quadlet_secrets | zip(quadlet_secret_sums.results) | list }}"
  loop_control:
    label: "{{ item.0.name }}"
  when: item.1.stdout | trim != (item.0.value | hash('sha256'))
  register: quadlet_secret_writes
  changed_when: true
  no_log: true

- name: Report whether any secret changed
  ansible.builtin.set_fact:
    quadlet_secrets_changed: "{{ quadlet_secret_writes.results | selectattr('changed', 'defined') | selectattr('changed') | list | length > 0 }}"
