---
# One WireGuard peer the deploy makes (defaults/main.yml, edge_peers), once:
# it creates the client edge_peer.name in wg-easy (through its API on
# loopback) and adds its config to the Secret Manager secret
# edge_peer.secret. They are:
#   owner   the owner's first peer, so nobody needs public SSH to make one.
#           The deployer may add to wireguard-owner-peer but not read it; the
#           owner fetches it with `scripts/secret.sh pull wireguard-owner-peer`.
#   deploy  the deploy's own way to the proxy over the VPN, which it reads
#           back from wireguard-deploy-peer (scripts/ssh-config.sh vpn).
#   agents  one per service that ships telemetry here (edge_peer.address
#           set): moved to that fixed address in the agent half, where the
#           firewall and Caddy let it only write telemetry, with a keepalive
#           and a smaller MTU. The deployer may add to their secrets but not
#           read them; each is read by its own service (scripts/bootstrap.sh).
#
# Before creating it, wg-easy's default client DNS is cleared: the tunnel is
# split (only the tunnel range goes through it), so a peer keeps its own
# resolver instead of being pointed at 1.1.1.1. Later peers made in the UI
# follow that default too.
#
# Every deploy fetches each config again and adds a version only when it
# changed (a sha256 marker per peer on the proxy), so a failed upload is
# retried.

- name: The wg-easy API answers
  ansible.builtin.uri:
    url: "{{ edge_wg_easy_api }}/client"
    url_username: admin
    url_password: "{{ watchtower_secret.wg_easy_password }}"
    force_basic_auth: true
  register: edge_wg_clients
  until: edge_wg_clients.status == 200
  retries: 30
  delay: 5
  no_log: true

# Only the id: wg-easy's client records carry the peer's private key, which
# no fact (and so no -v output) may hold.
- name: Find the peer
  ansible.builtin.set_fact:
    edge_peer_id: >-
      {{ edge_wg_clients.json | selectattr('name', 'equalto', edge_peer.name)
         | map(attribute='id') | first | default('') }}
  no_log: true

- name: Create the peer, with no forced DNS
  when: edge_peer_id | string | length == 0
  block:
    - name: Read wg-easy's client defaults
      ansible.builtin.uri:
        url: "{{ edge_wg_easy_api }}/admin/userconfig"
        url_username: admin
        url_password: "{{ watchtower_secret.wg_easy_password }}"
        force_basic_auth: true
      register: edge_wg_userconfig
      no_log: true

    - name: Clear the default client DNS
      ansible.builtin.uri:
        url: "{{ edge_wg_easy_api }}/admin/userconfig"
        method: POST
        body_format: json
        body: >-
          {{ edge_wg_userconfig.json | combine({'defaultDns': []})
             | dict2items | rejectattr('key', 'in', ['id', 'createdAt', 'updatedAt']) | items2dict }}
        url_username: admin
        url_password: "{{ watchtower_secret.wg_easy_password }}"
        force_basic_auth: true
      when: edge_wg_userconfig.json.defaultDns | length > 0
      no_log: true

    - name: Create the client
      ansible.builtin.uri:
        url: "{{ edge_wg_easy_api }}/client"
        method: POST
        body_format: json
        body: {name: "{{ edge_peer.name }}", expiresAt: null}
        url_username: admin
        url_password: "{{ watchtower_secret.wg_easy_password }}"
        force_basic_auth: true
      register: edge_peer_created
      no_log: true

    - name: Remember its id
      ansible.builtin.set_fact:
        edge_peer_id: "{{ edge_peer_created.json.clientId }}"

# An agent's config runs on someone else's server, as root (wg-quick), so
# every deploy puts back what watchtower decides: its address, keepalive and
# MTU; the tunnel range as its only route and the server's only route to it
# (so it can't take an admin address); no DNS; and no hooks, which wg-quick
# would run. wg-easy's update takes the whole client, so read it, set those
# fields and send it back without the keys and bookkeeping. Before the
# config is fetched, so the published one has them.
- name: Pin an agent peer's settings
  when: edge_peer.address is defined
  vars:
    edge_agent_settings: >-
      {{ {'ipv4Address': edge_peer.address, 'persistentKeepalive': edge_agent_keepalive | int,
          'mtu': edge_agent_mtu | int, 'allowedIps': [watchtower_tunnel_cidr], 'serverAllowedIps': [],
          'dns': [], 'preUp': '', 'postUp': '', 'preDown': '', 'postDown': ''} }}
  block:
    - name: No other peer holds its address
      ansible.builtin.assert:
        that: >-
          edge_wg_clients.json | rejectattr('id', 'equalto', edge_peer_id | int)
          | selectattr('ipv4Address', 'equalto', edge_peer.address) | list | length == 0
        fail_msg: another wg-easy client already has {{ edge_peer.address }}; free it or change names.AgentPeers
        quiet: true

    - name: Read the agent peer
      ansible.builtin.uri:
        url: "{{ edge_wg_easy_api }}/client/{{ edge_peer_id }}"
        url_username: admin
        url_password: "{{ watchtower_secret.wg_easy_password }}"
        force_basic_auth: true
      register: edge_agent_client
      no_log: true

    - name: Update it
      ansible.builtin.uri:
        url: "{{ edge_wg_easy_api }}/client/{{ edge_peer_id }}"
        method: POST
        body_format: json
        body: >-
          {{ edge_agent_client.json | combine(edge_agent_settings)
             | dict2items
             | rejectattr('key', 'in', ['id', 'createdAt', 'updatedAt', 'privateKey', 'publicKey', 'preSharedKey',
                                        'userId', 'interfaceId', 'endpoint', 'oneTimeLink'])
             | items2dict }}
        url_username: admin
        url_password: "{{ watchtower_secret.wg_easy_password }}"
        force_basic_auth: true
      when: >-
        edge_agent_client.json | dict2items | selectattr('key', 'in', edge_agent_settings.keys()) | items2dict
        != edge_agent_settings
      register: edge_agent_update
      failed_when: false
      changed_when: true
      no_log: true

    # The update's own result is hidden (its request holds the client), so
    # say here, with nothing from the body, whether wg-easy took it.
    - name: The update went through
      ansible.builtin.assert:
        that: edge_agent_update is skipped or edge_agent_update.status | default(0) == 200
        fail_msg: "wg-easy refused the update of {{ edge_peer.name }}: HTTP {{ edge_agent_update.status | default('none') }}"
        quiet: true

- name: The peer's config
  ansible.builtin.uri:
    url: "{{ edge_wg_easy_api }}/client/{{ edge_peer_id }}/configuration"
    url_username: admin
    url_password: "{{ watchtower_secret.wg_easy_password }}"
    force_basic_auth: true
    return_content: true
  register: edge_peer_config
  no_log: true

# An agent's config goes out only as pinned: nothing wg-quick would run, no
# DNS, the tunnel as its only route, its address and settings. The checks
# print nothing from the config.
- name: An agent's config is safe to publish
  when: edge_peer.address is defined
  ansible.builtin.assert:
    that:
      - edge_peer_config.content is not regex('(?im)^\s*(PreUp|PostUp|PreDown|PostDown|DNS|Table|FwMark|SaveConfig)\s*=')
      - edge_peer_config.content | regex_findall('(?m)^\[Peer\]$') | length == 1
      - edge_peer_config.content is regex('(?m)^AllowedIPs = ' ~ (watchtower_tunnel_cidr | regex_escape) ~ '$')
      - edge_peer_config.content is regex('(?m)^Address = ' ~ (edge_peer.address | regex_escape) ~ '/32$')
      - edge_peer_config.content is regex('(?m)^MTU = ' ~ edge_agent_mtu ~ '$')
      - edge_peer_config.content is regex('(?m)^PersistentKeepalive = ' ~ edge_agent_keepalive ~ '$')
    fail_msg: wg-easy's config for {{ edge_peer.name }} has hooks, DNS or more routes, or lacks its pinned settings; not publishing it
    quiet: true

- name: What was last published
  ansible.builtin.slurp:
    src: "{{ watchtower_config }}/{{ edge_peer.name }}-peer.sha256"
  register: edge_peer_published
  failed_when: false

- name: Publish a new or changed config
  when: >-
    (edge_peer_published.content | default('') | b64decode | trim)
    != (edge_peer_config.content | hash('sha256'))
  block:
    # From the controller: the deployer's key there may add a version and
    # nothing else (scripts/bootstrap.sh).
    - name: Add it to Secret Manager
      ansible.builtin.command:
        argv: [gcloud, secrets, versions, add, "{{ edge_peer.secret }}", --project, "{{ watchtower_gcp_project }}", --data-file=-]
        stdin: "{{ edge_peer_config.content }}"
        stdin_add_newline: false
      environment:
        CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
        CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: "{{ lookup('ansible.builtin.env', 'GOOGLE_APPLICATION_CREDENTIALS') }}"
      delegate_to: localhost
      become: false
      changed_when: true
      no_log: true

    - name: Mark it published
      ansible.builtin.copy:
        content: "{{ edge_peer_config.content | hash('sha256') }}\n"
        dest: "{{ watchtower_config }}/{{ edge_peer.name }}-peer.sha256"
        mode: "0600"
        owner: root
        group: root
