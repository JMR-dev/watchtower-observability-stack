---
# SSH brute-force protection behind the firewalls, which already keep SSH to
# WireGuard peers, the break-glass bastion and (on a node) the proxy: one
# bad address at a time, if any of those misbehaves.
# It keeps its own nftables table (inet f2b-table), apart from roles/firewall's.

- name: Enable EPEL (provides fail2ban on AlmaLinux 10)
  ansible.builtin.dnf:
    name: epel-release
    state: present

# fail2ban-server, not the fail2ban metapackage: that one pulls in
# fail2ban-firewalld and with it firewalld, which roles/firewall keeps off.
- name: Install fail2ban
  ansible.builtin.dnf:
    name: fail2ban-server
    state: present
    update_cache: true

- name: Render jail.local
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    owner: root
    group: root
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
