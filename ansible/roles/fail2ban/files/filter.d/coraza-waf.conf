# /etc/fail2ban/filter.d/coraza-waf.conf
#
# Matches the Section A transaction header in a Coraza serial audit log.
#
# Coraza serial audit log structure (SecAuditLogType Serial):
#   --<boundary>--A--                              ← boundary marker (ignored)
#   [DD/Mon/YYYY:HH:MM:SS[.us] ±ZZZZ] id ip port dst_ip dst_port  ← matched
#   --<boundary>--B--                              ← request headers (ignored)
#   ...
#   --<boundary>--H--                              ← rule messages (ignored)
#   --<boundary>--Z--                              ← end marker (ignored)
#
# With SecAuditEngine RelevantOnly, ONLY transactions that matched a WAF rule
# are written to the log, so every match of the Section A header == a WAF hit.
#
# The timestamp format is [DD/Mon/YYYY:HH:MM:SS ±HHMM] (Apache Combined style)
# with an optional sub-second fraction. fail2ban extracts the date via
# datepattern; the failregex captures <HOST> (client IP) from the same line.

[INCLUDES]
before = common.conf

[Definition]

failregex = ^\[[\d]{2}/\w+/[\d]{4}:[\d]{2}:[\d]{2}:[\d]{2}(?:\.[\d]+)? [+-][\d]{4}\] \S+ <HOST> [\d]+ \S+ [\d]+\s*$

ignoreregex =

# Timestamp is at the start of the line, wrapped in square brackets.
datepattern = {^LN-BEG}\[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]
