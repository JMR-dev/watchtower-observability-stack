---
# Bantime / findtime / maxretry defaults — override in group_vars/all/main.yml.
fail2ban_bantime: 1h
fail2ban_findtime: 10m
fail2ban_maxretry: 5
fail2ban_destemail: root@localhost
fail2ban_sender: fail2ban@watchtower

# Recidive: bans repeat offenders for a long time.
fail2ban_recidive_bantime: 1w
fail2ban_recidive_findtime: 1d
fail2ban_recidive_maxretry: 5
