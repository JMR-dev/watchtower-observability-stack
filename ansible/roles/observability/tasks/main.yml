---
- name: Ensure observability config and secret directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: root
    group: root
  loop:
    - { path: "{{ observability_secrets_dir }}", mode: "0700" }
    - { path: "{{ observability_config_dir }}", mode: "0755" }
    - { path: "{{ observability_config_dir }}/mimir", mode: "0755" }
    - { path: "{{ observability_config_dir }}/loki", mode: "0755" }
    - { path: "{{ observability_config_dir }}/tempo", mode: "0755" }
    - { path: "{{ observability_config_dir }}/grafana", mode: "0755" }
    - { path: "{{ observability_config_dir }}/grafana/provisioning", mode: "0755" }
    - { path: "{{ observability_config_dir }}/grafana/provisioning/datasources", mode: "0755" }
    - { path: "{{ observability_config_dir }}/grafana/provisioning/dashboards", mode: "0755" }
    - { path: "{{ observability_config_dir }}/caddy", mode: "0755" }
    - { path: /var/log/observability, mode: "0750" }
    - { path: /etc/containers/systemd, mode: "0755" }
    - { path: /etc/observability/caddy-build, mode: "0755" }

# Container processes run as non-root UIDs. Bind-mounted data dirs must be
# owned by those UIDs or the services cannot create their WAL/index/DB files.
- name: Ensure data directories with correct UIDs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "0750"
    owner: "{{ item.uid }}"
    group: "{{ item.gid }}"
  loop:
    - { path: "{{ observability_data_root }}/mimir",      uid: 10001, gid: 10001 }
    - { path: "{{ observability_data_root }}/loki",       uid: 10001, gid: 10001 }
    - { path: "{{ observability_data_root }}/tempo",      uid: 10001, gid: 10001 }
    - { path: "{{ observability_data_root }}/grafana",    uid: 472,   gid: 472 }
    - { path: "{{ observability_data_root }}/caddy",      uid: 1000,  gid: 1000 }
    - { path: "{{ observability_data_root }}/caddy/logs", uid: 1000,  gid: 1000 }

- name: Write S3 credentials env file
  ansible.builtin.template:
    src: s3.env.j2
    dest: "{{ observability_secrets_dir }}/s3.env"
    mode: "0600"
    owner: root
    group: root
  notify:
    - Restart mimir
    - Restart loki
    - Restart tempo

- name: Render Mimir config
  ansible.builtin.template:
    src: mimir.yaml.j2
    dest: "{{ observability_config_dir }}/mimir/mimir.yaml"
    mode: "0644"
  notify: Restart mimir

- name: Render Loki config
  ansible.builtin.template:
    src: loki.yaml.j2
    dest: "{{ observability_config_dir }}/loki/loki.yaml"
    mode: "0644"
  notify: Restart loki

- name: Render Tempo config
  ansible.builtin.template:
    src: tempo.yaml.j2
    dest: "{{ observability_config_dir }}/tempo/tempo.yaml"
    mode: "0644"
  notify: Restart tempo

- name: Render Grafana config
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ observability_config_dir }}/grafana/grafana.ini"
    mode: "0640"
  notify: Restart grafana

- name: Render Grafana datasource provisioning
  ansible.builtin.template:
    src: datasources.yaml.j2
    dest: "{{ observability_config_dir }}/grafana/provisioning/datasources/datasources.yaml"
    mode: "0644"
  notify: Restart grafana

- name: Render Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ observability_config_dir }}/caddy/Caddyfile"
    mode: "0644"
  notify: Restart caddy

- name: Render wg-easy env file
  ansible.builtin.template:
    src: wg-easy.env.j2
    dest: "{{ observability_secrets_dir }}/wg-easy.env"
    mode: "0600"
    owner: root
    group: root
  notify: Restart wg-easy

- name: Apply SELinux context to config tree
  ansible.builtin.command: restorecon -R /etc/observability
  changed_when: false

- name: Deploy Podman network quadlet
  ansible.builtin.copy:
    src: observability.network
    dest: /etc/containers/systemd/observability.network
    mode: "0644"
  notify: Reload systemd

- name: Deploy volume quadlets
  ansible.builtin.template:
    src: "{{ item }}.volume.j2"
    dest: "/etc/containers/systemd/{{ item }}.volume"
    mode: "0644"
  loop:
    - mimir-data
    - loki-data
    - tempo-data
    - grafana-data
    - caddy-data
  notify: Reload systemd

# Copy the Caddy build context to the server so podman build runs locally.
- name: Copy Caddy + Coraza Dockerfile to server
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../build/caddy/Dockerfile"
    dest: /etc/observability/caddy-build/Dockerfile
    mode: "0644"
  register: caddy_dockerfile_result

- name: Check if Caddy + Coraza image already exists
  ansible.builtin.command: podman image inspect localhost/watchtower-caddy:latest
  register: caddy_image_inspect
  changed_when: false
  failed_when: false

- name: Build Caddy + Coraza image
  ansible.builtin.command: podman build -t localhost/watchtower-caddy:latest /etc/observability/caddy-build/
  when: caddy_image_inspect.rc != 0 or caddy_dockerfile_result.changed
  notify: Restart caddy

- name: Deploy container quadlets
  ansible.builtin.template:
    src: "{{ item }}.container.j2"
    dest: "/etc/containers/systemd/{{ item }}.container"
    mode: "0644"
  loop:
    - mimir
    - loki
    - tempo
    - grafana
    - wg-easy
    - caddy
  notify:
    - Reload systemd
    - Restart all services

- name: Force handlers to flush before health checks
  ansible.builtin.meta: flush_handlers

- name: Deploy disk-guard script
  ansible.builtin.template:
    src: disk-guard.sh.j2
    dest: /usr/local/bin/disk-guard.sh
    mode: "0750"
    owner: root
    group: root

- name: Deploy disk-guard systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  loop:
    - disk-guard.service
    - disk-guard.timer
  notify:
    - Reload systemd
    - Restart disk-guard timer

- name: Enable and start disk-guard timer
  ansible.builtin.systemd:
    name: disk-guard.timer
    enabled: true
    state: started
    daemon_reload: true

# Health checks run on the managed host (via SSH) so they work regardless of
# whether the Ansible controller is connected to the WireGuard VPN.  The server
# can reach its own WireGuard IP (10.8.0.1) via the local wg0 interface.
- name: Wait for Caddy to be ready
  ansible.builtin.uri:
    url: "http://{{ wireguard_server_ip }}/api/health"
    status_code: 200
  register: caddy_ready
  retries: 30
  delay: 5
  until: caddy_ready.status == 200
  delegate_to: "{{ inventory_hostname }}"

- name: Wait for Mimir /ready
  ansible.builtin.uri:
    url: "http://{{ wireguard_server_ip }}:8080/ready"
    status_code: 200
  register: mimir_ready
  retries: 30
  delay: 5
  until: mimir_ready.status == 200
  delegate_to: "{{ inventory_hostname }}"

- name: Wait for Loki /ready
  ansible.builtin.uri:
    url: "http://{{ wireguard_server_ip }}:3100/ready"
    status_code: 200
  register: loki_ready
  retries: 30
  delay: 5
  until: loki_ready.status == 200
  delegate_to: "{{ inventory_hostname }}"

- name: Wait for Tempo /ready
  ansible.builtin.uri:
    url: "http://{{ wireguard_server_ip }}:3200/ready"
    status_code: 200
  register: tempo_ready
  retries: 30
  delay: 5
  until: tempo_ready.status == 200
  delegate_to: "{{ inventory_hostname }}"

