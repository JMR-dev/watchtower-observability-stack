---
# Two steps under one notification: move leadership off this member if it
# leads, then restart it.
- name: Move Patroni leadership away from this member
  ansible.builtin.include_tasks: switchover.yml
  listen: Restart patroni

- name: Restart patroni service
  ansible.builtin.systemd_service:
    name: patroni
    state: restarted
    daemon_reload: true
  listen: Restart patroni
