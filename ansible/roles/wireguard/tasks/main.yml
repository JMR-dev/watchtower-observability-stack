---
- name: Install wireguard-tools
  ansible.builtin.package:
    name: wireguard-tools
    state: present

- name: Ensure /etc/wireguard exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    mode: "0700"
    owner: root
    group: root

# wg-easy runs `wg-quick up wg0` inside its container, which calls
# iptables-legacy to set up the NAT POSTROUTING rule.  AlmaLinux 10 doesn't
# auto-load the legacy iptables kernel modules, so the call fails with
# "can't initialize iptables table 'nat': Table does not exist" and wg0 is
# torn down.  Load the modules now and persist them across reboots.
- name: Load iptables kernel modules required by wg-easy
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - ip_tables
    - iptable_filter
    - iptable_nat
    - nf_nat
    - nf_conntrack

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Enable src_valid_mark (required for WireGuard routing)
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.src_valid_mark
    value: "1"
    sysctl_set: true
    state: present
    reload: true

# wg-easy takes over wg0 management; ensure wg-quick is not competing.
- name: Disable and stop wg-quick
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: false
    state: stopped
  failed_when: false
