---
# Host baseline: current packages, podman, persistent journald (Fluent Bit
# ships it), SELinux enforcing, the wireguard module, and nightly security
# updates that never reboot on their own (roles/reboot does, gated).

- name: Update all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest # noqa package-latest -- first boot and maintenance runs want current packages
    update_cache: true

- name: Install base packages
  ansible.builtin.dnf:
    name:
      - podman
      - container-selinux
      - cryptsetup
      - xfsprogs
      - wireguard-tools
      - dnf-automatic
      - dnf-utils
      - python3-libselinux
      - policycoreutils-python-utils
      - jq
      - bind-utils
      - tar
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

# Persistent, so Fluent Bit's systemd input finds /var/log/journal. Every
# container logs here too (LogDriver=journald).
- name: Configure persistent journald with size cap
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/persistent.conf
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=2G
      SystemMaxFileSize=128M
      MaxRetentionSec=14day
  notify: [Restart journald, Flush the journal to disk]

# Storage=persistent alone isn't enough on AlmaLinux 10: a restarted
# journald keeps writing to /run/log/journal until /var/log/journal exists
# and the journal is flushed into it.
- name: The persistent journal's directory
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    mode: "2755"
    owner: root
    group: systemd-journal
  notify: [Restart journald, Flush the journal to disk]

# Now, not at the end of the play: Fluent Bit (roles/logship) reads it.
- name: Apply the journal settings
  ansible.builtin.meta: flush_handlers

- name: Ensure SELinux enforcing
  ansible.posix.selinux:
    policy: targeted
    state: enforcing

# Containers start under systemd (quadlets) and need to manage their cgroups.
- name: Let containers manage cgroups
  ansible.posix.seboolean:
    name: container_manage_cgroup
    state: true
    persistent: true

# wg1 (the mesh) on every host, wg0 (wg-easy) on the proxy. Loaded here so
# no container needs SYS_MODULE.
- name: Load the wireguard module at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/wireguard.conf
    mode: "0644"
    content: "wireguard\n"
  notify: Load wireguard

- name: Ensure the config root exists
  ansible.builtin.file:
    path: "{{ watchtower_config }}"
    state: directory
    mode: "0750"
    owner: root
    group: root

# dnf-automatic installs security updates nightly and never reboots: a host
# rebooting on its own could take a second node down while one is already
# out. roles/reboot reboots one host at a time, after checking the others.
- name: Render dnf-automatic config (security updates, apply, no reboot)
  ansible.builtin.copy:
    dest: /etc/dnf/automatic.conf
    mode: "0644"
    owner: root
    group: root
    content: |
      # Managed by Ansible — see roles/base/tasks/main.yml.
      [commands]
      upgrade_type = security
      random_sleep = 360
      network_online_timeout = 60
      download_updates = yes
      apply_updates = yes
      reboot = never

      [emitters]
      emit_via = stdio,motd

- name: Enable dnf-automatic-install.timer
  ansible.builtin.systemd:
    name: dnf-automatic-install.timer
    enabled: true
    state: started
