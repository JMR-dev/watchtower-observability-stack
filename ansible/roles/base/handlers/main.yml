---
- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: Flush the journal to disk
  ansible.builtin.command:
    argv: [journalctl, --flush]
  changed_when: true

- name: Load wireguard
  community.general.modprobe:
    name: wireguard
    state: present
