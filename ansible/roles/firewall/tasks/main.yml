---
# Host firewall: raw nftables in a table of our own (templates/watchtower.nft.j2),
# loaded by a unit of our own. No firewalld: it rejects pod-to-pod traffic
# addressed by pod IP unless the pod and Service ranges are trusted, which
# breaks Loki's memberlist gossip among other things.

- name: Install nftables
  ansible.builtin.dnf:
    name: nftables
    state: present

- name: Ensure /etc/nftables exists
  ansible.builtin.file:
    path: /etc/nftables
    state: directory
    mode: "0755"

- name: Render the watchtower ruleset
  ansible.builtin.template:
    src: watchtower.nft.j2
    dest: /etc/nftables/watchtower.nft
    mode: "0640"
    owner: root
    group: root
    validate: nft --check --file %s
  notify: Reload watchtower-nftables

- name: Install the watchtower-nftables unit
  ansible.builtin.copy:
    src: watchtower-nftables.service
    dest: /etc/systemd/system/watchtower-nftables.service
    mode: "0644"
    owner: root
    group: root

- name: Enable and start watchtower-nftables
  ansible.builtin.systemd_service:
    name: watchtower-nftables
    enabled: true
    state: started
    daemon_reload: true

# Masked, never stopped: its stop runs `nft flush ruleset`.
- name: Mask nftables.service
  ansible.builtin.systemd_service:
    name: nftables
    masked: true

- name: Gather service facts
  ansible.builtin.service_facts:

# Only once our ruleset is loaded, so the node is never left unfiltered.
- name: Stop firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    state: stopped
  when: "'firewalld.service' in ansible_facts.services"

# Masked whether or not it is installed: a later install would otherwise be
# enabled by the distribution preset and start on the next reboot.
- name: Mask firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    masked: true
