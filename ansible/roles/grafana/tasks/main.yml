---
# Grafana: three instances, one per node, sharing one Postgres database
# (roles/patroni), so logins, orgs, dashboards and alert state are the same
# whichever instance Caddy picks. Unified alerting runs as an HA cluster over
# the mesh, so a notification goes out once.

# The config directory is mounted whole into a container that runs as a
# non-root user, which has to be able to enter it: 0755. It holds no secrets
# (those come from podman secrets).
- name: Grafana directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
  loop:
    # The image's grafana user.
    - {path: "{{ watchtower_data }}/grafana", owner: 472, mode: "0750"}
    - {path: "{{ watchtower_config }}/grafana", owner: root, mode: "0755"}
    - {path: "{{ watchtower_config }}/grafana/provisioning", owner: root, mode: "0755"}
    - {path: "{{ watchtower_config }}/grafana/provisioning/datasources", owner: root, mode: "0755"}
    - {path: "{{ watchtower_config }}/grafana/provisioning/alerting", owner: root, mode: "0755"}
    - {path: "{{ watchtower_config }}/grafana/provisioning/dashboards", owner: root, mode: "0755"}
    - {path: "{{ watchtower_config }}/grafana/provisioning/dashboards/telemetry", owner: root, mode: "0755"}

# The database and its owner, once, on whichever member leads.
- name: Find the Postgres leader
  ansible.builtin.uri:
    url: http://{{ hostvars[item].mesh_ip }}:{{ watchtower_ports.patroni }}/primary
    status_code: [200, 503]
  loop: "{{ groups['nodes'] }}"
  register: grafana_pg_primary
  run_once: true

- name: Create Grafana's role and database (or reset its password)
  ansible.builtin.command:
    argv: [podman, exec, -i, patroni, psql, -d, postgres, -v, ON_ERROR_STOP=1, -q]
    stdin: |
      DO $$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'grafana') THEN
          CREATE ROLE grafana LOGIN PASSWORD '{{ watchtower_secret.grafana_db_password | replace("'", "''") }}';
        ELSE
          ALTER ROLE grafana LOGIN PASSWORD '{{ watchtower_secret.grafana_db_password | replace("'", "''") }}';
        END IF;
      END
      $$;
      SELECT 'CREATE DATABASE grafana OWNER grafana' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'grafana')\gexec
  delegate_to: "{{ (grafana_pg_primary.results | selectattr('status', 'equalto', 200) | first).item }}"
  run_once: true
  changed_when: false
  no_log: true

# Grafana reads alerting provisioning only as it starts, and a file it can't
# read stops it: CI starts the pinned Grafana on exactly these files
# (scripts/check-grafana.sh).
- name: Grafana config, datasources, telemetry alerts and the dashboards' provider
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ watchtower_config }}/grafana/{{ item.dest }}"
    mode: "0644"
  loop:
    - {src: grafana.ini.j2, dest: grafana.ini}
    - {src: datasources.yaml.j2, dest: provisioning/datasources/watchtower.yaml}
    - {src: telemetry-rules.yaml.j2, dest: provisioning/alerting/telemetry-rules.yaml}
    - {src: telemetry-dashboards.yaml.j2, dest: provisioning/dashboards/telemetry.yaml}
  notify: Restart grafana

# The provider rereads it every minute: no restart.
- name: The telemetry fleet dashboard
  ansible.builtin.template:
    src: telemetry-fleet.json.j2
    dest: "{{ watchtower_config }}/grafana/provisioning/dashboards/telemetry/telemetry-fleet.json"
    mode: "0644"

# telemetry-notifications.yaml reads the ping URL from the podman secret
# grafana-telemetry-alert-url ($__file{}), and Grafana won't start if that file
# is there and the secret isn't mounted. So the order holds at every step a run
# could stop at: the file goes first when the URL is gone, and comes last when
# it's there, after the secret, the quadlet's Secret= line and a daemon-reload
# (scripts/check-grafana-provisioning.py checks it). Removing the file here
# does not take the contact point out of Grafana's database (docs/runbook.md,
# "Telemetry alerts").
- name: No contact point file without the ping URL
  ansible.builtin.file:
    path: "{{ watchtower_config }}/grafana/provisioning/alerting/telemetry-notifications.yaml"
    state: absent
  when: not grafana_telemetry_notify | bool
  notify: Restart grafana

- name: Grafana's secrets
  ansible.builtin.include_role:
    name: quadlet
    tasks_from: secrets
  vars:
    quadlet_secrets: >-
      {{ [
           {'name': 'grafana-admin-password', 'value': watchtower_secret.grafana_admin_password},
           {'name': 'grafana-secret-key', 'value': watchtower_secret.grafana_secret_key},
           {'name': 'grafana-db-password', 'value': watchtower_secret.grafana_db_password},
         ] + ([{'name': 'grafana-telemetry-alert-url', 'value': watchtower_optional_secret.healthchecks_telemetry_alert_url}]
              if grafana_telemetry_notify | bool else []) }}

- name: Restart Grafana when a secret changed
  ansible.builtin.debug:
    msg: secrets changed
  changed_when: quadlet_secrets_changed | bool
  notify: Restart grafana

- name: Pull Grafana
  containers.podman.podman_image:
    name: "{{ watchtower_images.grafana }}"

- name: Grafana quadlet
  ansible.builtin.template:
    src: grafana.container.j2
    dest: /etc/containers/systemd/grafana.container
    mode: "0644"
  notify: Restart grafana

# Every run, not only when the quadlet changed: a run that stopped between the
# two would leave systemd with the old unit, and Restart=always would start
# Grafana without the Secret= line once the file below is there.
- name: Load the quadlet before the contact point file can need its secret
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: The telemetry alerts' contact point and notification policy
  ansible.builtin.template:
    src: telemetry-notifications.yaml.j2
    dest: "{{ watchtower_config }}/grafana/provisioning/alerting/telemetry-notifications.yaml"
    mode: "0644"
  when: grafana_telemetry_notify | bool
  notify: Restart grafana

- name: Start Grafana
  ansible.builtin.systemd_service:
    name: grafana
    state: started
    daemon_reload: true

- name: Apply Grafana changes now
  ansible.builtin.meta: flush_handlers

- name: Wait for Grafana
  ansible.builtin.uri:
    url: http://{{ mesh_ip }}:{{ watchtower_ports.grafana.http }}/api/health
  register: grafana_health
  until: grafana_health.status == 200
  retries: 30
  delay: 5
