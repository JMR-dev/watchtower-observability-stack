name: Toolchain + credentials
description: |
  Installs pinned, checksum-verified tools and, optionally, writes the GCP
  key and reads the secrets a job needs from Secret Manager.

  Every download is pinned and verified against a hard-coded SHA-256; bumping
  a tool means changing its version AND hash together. Sources of the hashes:
    go          go.dev/dl/?mode=json&include=all
    pulumi      pulumi-<v>-checksums.txt on the GitHub release
    uv          uv-<arch>-unknown-linux-gnu.tar.gz.sha256 on the GitHub release
    alloy       SHA256SUMS on the GitHub release
    actionlint  actionlint_<v>_checksums.txt on the GitHub release
    wireproxy   checksums.txt on the GitHub release (windtf/wireproxy,
                formerly whyvl/wireproxy)
    shellcheck  computed from the GitHub release tarball on 2026-10-23
                (the project publishes no checksum file)
    awscli      computed from the official zip on 2026-10-23 (AWS publishes
                a PGP signature, no checksum)
    gcloud      computed from the official tarball on 2026-10-24 (Google
                publishes no checksum for the current release)
  Python tools come from uv, into a venv on a uv-managed CPython 3.13, from
  hash-locked requirement files (`--require-hashes`):
    ansible       ansible/requirements.txt (ansible-core)
    ansible-lint  ansible/requirements-lint.txt (ansible-core + ansible-lint)
    semgrep       .gitea/requirements/semgrep.txt
  uv and those three also install on arm64 runners (the Patroni image job);
  every other tool is amd64 only.

  Secrets: every line of `secrets` is NAME=id or @NAME=id, id a Secret
  Manager secret (scripts/bootstrap.sh creates and grants every id
  deploy.yml names here). NAME=id exports the value as NAME (one line
  only); @NAME=id writes it to a 0600 file and exports its path as NAME (for
  key files). A leading ? (?NAME=id, ?@NAME=id) makes it optional: a secret
  with no version yet leaves NAME unset instead of failing the job. Lines
  starting with # are comments. Every line of every value is masked in the log first. Reading
  needs `gcp-key` and installs gcloud.

  Composite actions have no post step, so a job that passes a key must end
  with the cleanup step shown in deploy.yml (`if: always()`).

inputs:
  tools:
    description: Space-separated subset of "go pulumi alloy shellcheck actionlint wireproxy awscli gcloud ansible ansible-lint semgrep"
    required: false
    default: ""
  gcp-key:
    description: JSON key of watchtower-deployer@ (secrets.GCP_DEPLOYER_KEY). Omit for none.
    required: false
    default: ""
  gcp-project:
    description: Project holding the secrets.
    required: false
    default: watchtower-observe
  secrets:
    description: NAME=id or @NAME=id lines; see above. Omit for none.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install tools
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
        SECRETS: ${{ inputs.secrets }}
        GO_VERSION: "1.27.3"
        GO_SHA256: 65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40
        PULUMI_VERSION: "3.272.0"
        PULUMI_SHA256: 58d545f2b98761051922008ebd381ecef95484d7f7a5ff7faa15d7a780ea84f6
        UV_VERSION: "0.13.5"
        UV_SHA256_X86_64: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
        UV_SHA256_AARCH64: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403
        ALLOY_VERSION: "1.21.2"
        ALLOY_SHA256: 1eadb46a0640127184250173acd9b4145e4d590680db37ffe66fa8afd07f04cf
        ACTIONLINT_VERSION: "1.7.12"
        ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        WIREPROXY_VERSION: "1.1.3"
        WIREPROXY_SHA256: e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c
        SHELLCHECK_VERSION: "0.11.0"
        SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        AWSCLI_VERSION: "2.38.5"
        AWSCLI_SHA256: 5def7d1b7e55d892f9a381bb2cb2081a685712464be0d36d5d706af0ac48d0d3
        GCLOUD_VERSION: "590.0.1"
        GCLOUD_SHA256: d1ae7be7e12c4e7d8286fab4774f5441020aca89dc7793ddacbace8d11d20f06
      run: |
        set -euo pipefail
        # Reading secrets needs gcloud.
        if [[ -n "${SECRETS//[[:space:]]/}" && " $TOOLS " != *" gcloud "* ]]; then
          TOOLS+=" gcloud"
        fi
        tools_dir="${RUNNER_TEMP}/tools"
        bin="${tools_dir}/bin"
        mkdir -p "$bin"
        echo "$bin" >>"$GITHUB_PATH"

        # fetch <url> <sha256> <dest>
        fetch() {
          curl -fsSL --retry 3 -o "$3" "$1"
          echo "$2  $3" | sha256sum -c --quiet -
        }

        arch="$(uname -m)"
        uv_install() {
          [[ -x "${bin}/uv" ]] && return 0
          local sum
          case "$arch" in
            x86_64) sum="$UV_SHA256_X86_64" ;;
            aarch64) sum="$UV_SHA256_AARCH64" ;;
            *) echo "uv: no pinned build for ${arch}" >&2; exit 1 ;;
          esac
          fetch "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${arch}-unknown-linux-gnu.tar.gz" "$sum" "${tools_dir}/uv.tgz"
          tar -C "$tools_dir" -xzf "${tools_dir}/uv.tgz"
          install -m 0755 "${tools_dir}/uv-${arch}-unknown-linux-gnu/uv" "${bin}/uv"
          echo "UV_NO_CACHE=1" >>"$GITHUB_ENV"
        }

        apt_deps="jq curl openssh-client unzip xz-utils ca-certificates"
        # nftables: CI checks the host firewall template with nft.
        [[ " $TOOLS " == *" ansible-lint "* ]] && apt_deps+=" nftables util-linux"
        sudo=""
        [[ "$(id -u)" == 0 ]] || sudo=sudo
        export DEBIAN_FRONTEND=noninteractive
        $sudo apt-get update -qq
        # shellcheck disable=SC2086
        $sudo apt-get install -y -qq --no-install-recommends $apt_deps >/dev/null

        for tool in $TOOLS; do
          case "$tool" in ansible | ansible-lint | semgrep) ;; *)
            [[ "$arch" == x86_64 ]] || { echo "${tool}: amd64 only (this runner is ${arch})" >&2; exit 1; } ;;
          esac
          case "$tool" in
            go)
              fetch "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" "$GO_SHA256" "${tools_dir}/go.tgz"
              tar -C "$tools_dir" -xzf "${tools_dir}/go.tgz"
              echo "${tools_dir}/go/bin" >>"$GITHUB_PATH"
              # Never let a go.mod `toolchain` line download an unverified Go.
              echo "GOTOOLCHAIN=local" >>"$GITHUB_ENV"
              ;;
            pulumi)
              fetch "https://github.com/pulumi/pulumi/releases/download/v${PULUMI_VERSION}/pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz" \
                "$PULUMI_SHA256" "${tools_dir}/pulumi.tgz"
              tar -C "$tools_dir" -xzf "${tools_dir}/pulumi.tgz"
              echo "${tools_dir}/pulumi" >>"$GITHUB_PATH"
              echo "PULUMI_SKIP_UPDATE_CHECK=true" >>"$GITHUB_ENV"
              ;;
            alloy)
              fetch "https://github.com/grafana/alloy/releases/download/v${ALLOY_VERSION}/alloy-linux-amd64.zip" \
                "$ALLOY_SHA256" "${tools_dir}/alloy.zip"
              unzip -q -o "${tools_dir}/alloy.zip" -d "$tools_dir"
              install -m 0755 "${tools_dir}/alloy-linux-amd64" "${bin}/alloy"
              ;;
            shellcheck)
              fetch "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
                "$SHELLCHECK_SHA256" "${tools_dir}/shellcheck.txz"
              tar -C "$tools_dir" -xJf "${tools_dir}/shellcheck.txz"
              install -m 0755 "${tools_dir}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "${bin}/shellcheck"
              ;;
            actionlint)
              fetch "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
                "$ACTIONLINT_SHA256" "${tools_dir}/actionlint.tgz"
              tar -C "$bin" -xzf "${tools_dir}/actionlint.tgz" actionlint
              ;;
            wireproxy)
              fetch "https://github.com/windtf/wireproxy/releases/download/v${WIREPROXY_VERSION}/wireproxy_linux_amd64.tar.gz" \
                "$WIREPROXY_SHA256" "${tools_dir}/wireproxy.tgz"
              tar -C "$bin" -xzf "${tools_dir}/wireproxy.tgz" wireproxy
              ;;
            awscli)
              fetch "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWSCLI_VERSION}.zip" "$AWSCLI_SHA256" "${tools_dir}/awscli.zip"
              unzip -q -o "${tools_dir}/awscli.zip" -d "$tools_dir"
              "${tools_dir}/aws/install" --install-dir "${tools_dir}/aws-cli" --bin-dir "$bin" >/dev/null
              ;;
            gcloud)
              fetch "https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-${GCLOUD_VERSION}-linux-x86_64.tar.gz" \
                "$GCLOUD_SHA256" "${tools_dir}/gcloud.tgz"
              tar -C "$tools_dir" -xzf "${tools_dir}/gcloud.tgz"
              echo "${tools_dir}/google-cloud-sdk/bin" >>"$GITHUB_PATH"
              # Config (and any credential gcloud caches) under RUNNER_TEMP,
              # never the job's HOME.
              {
                echo "CLOUDSDK_CONFIG=${RUNNER_TEMP}/gcloud"
                echo "CLOUDSDK_CORE_DISABLE_PROMPTS=1"
                echo "CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK=1"
              } >>"$GITHUB_ENV"
              ;;
            ansible | ansible-lint | semgrep)
              case "$tool" in
                ansible) lock=ansible/requirements.txt ;;
                ansible-lint) lock=ansible/requirements-lint.txt ;;
                semgrep) lock=.gitea/requirements/semgrep.txt ;;
              esac
              uv_install
              if [[ ! -x "${tools_dir}/py/bin/python" ]]; then
                UV_PYTHON_INSTALL_DIR="${tools_dir}/python" "${bin}/uv" venv -q --python 3.13 "${tools_dir}/py"
                echo "${tools_dir}/py/bin" >>"$GITHUB_PATH"
              fi
              "${bin}/uv" pip install -q --python "${tools_dir}/py/bin/python" --require-hashes -r "$lock"
              ;;
            *)
              echo "unknown tool: $tool" >&2
              exit 1
              ;;
          esac
        done

    - name: Write the GCP key
      if: inputs.gcp-key != ''
      shell: bash
      env:
        KEY: ${{ inputs.gcp-key }}
      run: |
        set -euo pipefail
        umask 077
        printf '%s' "$KEY" >"${RUNNER_TEMP}/gcp-deployer.json"
        echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/gcp-deployer.json" >>"$GITHUB_ENV"

    - name: Read secrets from Secret Manager
      if: inputs.secrets != ''
      shell: bash
      env:
        SECRETS: ${{ inputs.secrets }}
        PROJECT: ${{ inputs.gcp-project }}
      run: |
        set -euo pipefail
        key="${RUNNER_TEMP}/gcp-deployer.json"
        [[ -s "$key" ]] || { echo "reading secrets needs gcp-key" >&2; exit 1; }
        # By path and with its environment spelled out: what earlier steps
        # of this action wrote to GITHUB_PATH and GITHUB_ENV is not relied on.
        gcloud="${RUNNER_TEMP}/tools/google-cloud-sdk/bin/gcloud"
        export CLOUDSDK_CONFIG="${RUNNER_TEMP}/gcloud" CLOUDSDK_CORE_DISABLE_PROMPTS=1 \
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="$key"
        umask 077
        dir="${RUNNER_TEMP}/secrets"
        mkdir -p "$dir"
        while read -r line; do
          # Blank lines and comments: a # line in the block is text to YAML.
          [[ -n "$line" && "$line" != \#* ]] || continue
          if [[ ! "$line" =~ ^(\??)(@?)([A-Z][A-Z0-9_]*)=([a-z0-9-]+)$ ]]; then
            echo "bad secrets line: ${line}" >&2
            exit 1
          fi
          optional="${BASH_REMATCH[1]}" as_file="${BASH_REMATCH[2]}" name="${BASH_REMATCH[3]}" id="${BASH_REMATCH[4]}"
          file="${dir}/${id}"
          if ! "$gcloud" secrets versions access latest --secret "$id" --project "$PROJECT" --out-file "$file" 2>"${dir}/.err"; then
            # ?NAME=id: a secret that may have no version yet, which the job
            # copes with (the deploy's own VPN peer, before the first deploy).
            if [[ -n "$optional" ]]; then
              echo "${id} has no version yet; ${name} stays unset"
              rm -f "$file" "${dir}/.err"
              continue
            fi
            cat "${dir}/.err" >&2
            exit 1
          fi
          rm -f "${dir}/.err"
          # Masked before anything could print it. Semgrep's add-mask rule
          # warns that a job which stops workflow commands defeats masking;
          # here, anyone able to change a workflow that gets these secrets
          # could print GCP_DEPLOYER_KEY outright, so it adds no exposure.
          while IFS= read -r l || [[ -n "$l" ]]; do
            l="${l%$'\r'}"
            [[ -z "$l" ]] || echo "::add-mask::${l}" # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
          done <"$file"
          if [[ -n "$as_file" ]]; then
            echo "${name}=${file}" >>"$GITHUB_ENV"
            continue
          fi
          value="$(cat "$file")"
          value="${value%$'\r'}"
          rm -f "$file"
          if [[ -z "$value" || "$value" == *$'\n'* ]]; then
            echo "${id} is empty or more than one line; read a key file as @${name}=${id}" >&2
            exit 1
          fi
          echo "${name}=${value}" >>"$GITHUB_ENV"
        done <<<"$SECRETS"
