# Status checks for every pull request. No secrets and no credentials:
# nothing here can reach Hetzner, GCP or the hosts. Deploys are deploy.yml.
#
# Require these checks in the branch protection for main (Settings ->
# Branches): go, ansible, configs, images (caddy), images (patroni),
# images (wg-easy), semgrep, shell, alloy.
#
# Runs on the GKE runners (gitea-496920/gitea-runners; the gitea repo's
# docs/runners.md):
#   ubuntu-latest  a job pod of its own
#   heavy          a job pod alone on an e2-highmem-4: compiling the Pulumi
#                  providers' Go SDKs needs the memory
#   docker         the Docker-in-Docker runner (amd64); `docker build` and
#                  every check that runs a container image
#   docker-arm64   the same on arm64 (Spot, scale-to-zero): our images,
#                  built natively for the hosts, which are all ARM
#
# Actions are pinned to a full commit SHA, with the release in a comment.
name: ci

on:
  pull_request:

# A newer push to the PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: heavy
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: go
      - name: gofmt, vet, test (100% coverage), build
        working-directory: infra
        # Two packages at a time: compiling several provider SDK packages at
        # once (vet, test and build each compile) can exhaust the pod's memory.
        env:
          GOFLAGS: -p=2
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then echo "gofmt needed: $unformatted"; exit 1; fi
          go vet ./...
          go test -race -coverprofile="${RUNNER_TEMP}/cover.out" ./...
          ../scripts/coverage-gate.sh "${RUNNER_TEMP}/cover.out"
          go build -o /dev/null ./cloud

  ansible:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: ansible-lint
      - name: Syntax check every playbook and lint
        working-directory: ansible
        run: |
          set -euo pipefail
          ansible-galaxy collection install -r requirements.yml -p .collections >/dev/null
          for playbook in playbooks/site.yml playbooks/render.yml; do
            ansible-playbook -i inventory/hosts.sample.yml "$playbook" --syntax-check
          done
          ansible-lint
      - name: Render every host's firewall and check it with nft
        working-directory: ansible
        run: |
          set -euo pipefail
          # The role's `validate: nft --check` only runs on the hosts, so a
          # broken template would otherwise surface mid-deploy. Rendered from
          # the sample inventory, once as is and once with no IPv6 CI
          # addresses (an empty set), and checked by the kernel in a network
          # namespace of its own.
          for variant in sample v4-only; do
            extra=()
            [[ $variant == v4-only ]] && extra=(-e '{"watchtower_ci_cidrs": ["192.0.2.0/24"]}')
            ansible-playbook -i inventory/hosts.sample.yml playbooks/render.yml "${extra[@]}" >/dev/null
            for nft in .render/*/watchtower.nft; do
              unshare --user --map-root-user --net nft --check --file "$nft"
              echo "${variant} $(basename "$(dirname "$nft")"): ok"
            done
          done

  configs:
    # Runs the hosts' own images against their rendered configs.
    runs-on: docker
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: ansible
      - name: Render every host's configs
        working-directory: ansible
        run: ansible-playbook -i inventory/hosts.sample.yml playbooks/render.yml >/dev/null
      - name: quadlet, Loki, Mimir, Tempo and Fluent Bit check them
        run: scripts/check-configs.sh

  images:
    # The check names branch protection requires; without this Gitea would
    # append the runner too.
    name: images (${{ matrix.image }})
    # Built natively for the hosts, which are all ARM.
    runs-on: docker-arm64
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Every build/<name>/; a Go test keeps this list and deploy.yml's equal
      # to those directories.
      matrix:
        image: [caddy, patroni, wg-easy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: ansible
      - name: Render the configs the image is checked against
        working-directory: ansible
        run: ansible-playbook -i inventory/hosts.sample.yml playbooks/render.yml >/dev/null
      # The deploy reuses an image whose tag is in the registry, so a change
      # that keeps the tag would never ship.
      - name: A changed image has a new tag
        run: |
          set -euo pipefail
          git fetch -q --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          scripts/image-tag.sh --check FETCH_HEAD
      - name: Build, check its config, Trivy scan (no push)
        run: scripts/build-image.sh "${{ matrix.image }}" "watchtower-${{ matrix.image }}:ci-${GITHUB_SHA:0:12}"

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: semgrep
      - name: Semgrep (Go, shell, Dockerfiles, CI YAML, secrets)
        run: |
          set -euo pipefail
          # The GitHub Actions rules only look under .github/workflows; the
          # Gitea workflows and the setup action are the same format.
          gha="${RUNNER_TEMP}/gha/.github/workflows"
          mkdir -p "$gha"
          cp .gitea/workflows/*.yml "$gha/"
          cp .gitea/actions/setup/action.yml "$gha/setup-action.yml"
          semgrep scan --metrics=off --error \
            --config p/default --config p/golang --config p/dockerfile --config p/docker \
            --config p/secrets --config p/github-actions --config p/ci --config p/security-audit \
            --exclude ansible/.render --exclude ansible/.collections \
            . "${RUNNER_TEMP}/gha"

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: shellcheck actionlint
      - name: shellcheck
        run: shellcheck -x scripts/*.sh
      - name: actionlint (workflows, with shellcheck on their scripts)
        run: actionlint -config-file .gitea/actionlint.yaml .gitea/workflows/*.yml

  alloy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: alloy
      - name: The client example parses and is formatted
        run: diff -u config/alloy/config.alloy.example <(alloy fmt config/alloy/config.alloy.example)
