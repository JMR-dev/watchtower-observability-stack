# Deploy main:  images -> Hetzner (Pulumi) -> hosts (Ansible) -> verify.
#
#   push to main       deploys
#   workflow_dispatch  allow_replace=true to let a preview replace or delete a
#                      server, an IP, a volume or a bucket (check the runbook
#                      first: servers are replaced delete-first)
#
#   guard ─ images (caddy, patroni, wg-easy) ─ cloud ─ hosts
#
# Credentials: the repo Actions secret GCP_DEPLOYER_KEY (watchtower-deployer@).
# The cloud and hosts jobs' setup step uses it to read the secrets each needs
# from Secret Manager, and the Pulumi program reads its own with it. The
# image jobs alone hold another one, GAR_PUSH_KEY, which can only push to the
# Artifact Registry repo (docs/required-secrets.md). Every job that writes a
# key ends with the cleanup step, because composite actions have no post
# hook. The Gitea runners reach SSH from their Cloud NAT address
# (34.26.149.196), which the Hetzner firewalls admit.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_replace:
        description: Allow replacing or deleting servers, IPs, volumes or buckets
        type: boolean
        default: false

# One deploy at a time, and never cancelled: a cancelled `pulumi up` leaves
# pending operations, a cancelled Ansible run a half-rolled cluster.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  ALLOW_REPLACE: ${{ inputs.allow_replace || 'false' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      alpine_release: ${{ steps.alpine.outputs.ALPINE_RELEASE }}
      alpine_digest: ${{ steps.alpine.outputs.ALPINE_DIGEST }}
    steps:
      - name: Deploy only from main
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "deploys only run from main (got $GITHUB_REF)" >&2
            exit 1
          fi
          echo "Deploying ${GITHUB_SHA:0:12} (allow_replace=${ALLOW_REPLACE})"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
      # Once per deploy: the images jobs build on this release and the hosts
      # job installs the tags it names, even if Alpine publishes mid-run.
      - name: The Alpine release to build on (newest patch of our minor)
        id: alpine
        run: |
          set -euo pipefail
          scripts/image-tag.sh --alpine | tee -a "$GITHUB_OUTPUT"

  # Not GCP_DEPLOYER_KEY on the image jobs: jobs on the shared DinD runners
  # can see each other's credentials, so these get only the push key.
  images:
    needs: guard
    # Without this Gitea would append the runner to each job's name.
    name: images (${{ matrix.image }})
    # Built natively for the hosts, which are all ARM.
    runs-on: docker-arm64
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Every build/<name>/; a Go test keeps this list and ci.yml's equal to
      # those directories.
      matrix:
        image: [caddy, patroni, wg-easy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: ansible
      - name: Render the configs the image is checked against
        working-directory: ansible
        run: ansible-playbook -i inventory/hosts.sample.yml playbooks/render.yml >/dev/null
      # An image whose tag (version, Alpine release, revision) is already
      # in the registry is reused; the hosts job installs the same tags.
      - name: Build, check, scan and push (or reuse it)
        env:
          GAR_PUSH_KEY: ${{ secrets.GAR_PUSH_KEY }}
          ALPINE_RELEASE: ${{ needs.guard.outputs.alpine_release }}
          ALPINE_DIGEST: ${{ needs.guard.outputs.alpine_digest }}
        run: scripts/publish-image.sh "${{ matrix.image }}"
      - name: Remove registry credentials
        if: always()
        run: rm -f "${HOME}/.docker/config.json"

  cloud:
    needs: images
    # Room for the Pulumi providers, and on-demand: a preempted `pulumi up`
    # leaves the stack with pending operations to clear by hand.
    runs-on: heavy
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The state backend (the URL is in Pulumi.yaml) and the MinIO provider
      # both use the admin S3 key, each under its own names. The cluster key's
      # ID is read only so the log masks it: the program reads it for the
      # bucket policies itself, and a provider error can print a policy.
      - uses: ./.gitea/actions/setup
        with:
          tools: go pulumi
          gcp-key: ${{ secrets.GCP_DEPLOYER_KEY }}
          secrets: |
            PULUMI_CONFIG_PASSPHRASE=pulumi-passphrase
            AWS_ACCESS_KEY_ID=s3-admin-access-key
            AWS_SECRET_ACCESS_KEY=s3-admin-secret-key
            MINIO_USER=s3-admin-access-key
            MINIO_PASSWORD=s3-admin-secret-key
            HCLOUD_TOKEN=hcloud-token
            S3_CLUSTER_ACCESS_KEY=s3-cluster-access-key
      - name: Build the Pulumi program
        working-directory: infra
        env:
          GOFLAGS: -p=2
        run: go build -o bin/cloud ./cloud
      - name: Preview, with a guard on replacing servers, IPs, volumes and buckets
        working-directory: infra/cloud
        run: |
          set -euo pipefail
          pulumi stack select prod
          pulumi preview --diff
          pulumi preview --json >"${RUNNER_TEMP}/preview.json"
          ../../scripts/preview-guard.sh "${RUNNER_TEMP}/preview.json" \
            '^(hcloud:index/(server:Server|primaryIp:PrimaryIp|volume:Volume|network:Network|networkSubnet:NetworkSubnet)|minio:index/s3Bucket:S3Bucket|tls:index/privateKey:PrivateKey)$'
      - name: pulumi up
        working-directory: infra/cloud
        run: pulumi up --yes --skip-preview --stack prod
      - name: Remove keys
        if: always()
        run: rm -rf "${RUNNER_TEMP}/gcp-deployer.json" "${RUNNER_TEMP}/secrets" "${RUNNER_TEMP}/gcloud"

  hosts:
    # guard by name too: only a job that names it reads its outputs.
    needs: [guard, images, cloud]
    runs-on: heavy
    # The first run installs every host from scratch.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Ansible installs the workloads' secrets on the hosts (podman
      # secrets); the deploy reads them here, masked, and nowhere else.
      - uses: ./.gitea/actions/setup
        with:
          tools: pulumi ansible awscli
          gcp-key: ${{ secrets.GCP_DEPLOYER_KEY }}
          secrets: |
            PULUMI_CONFIG_PASSPHRASE=pulumi-passphrase
            AWS_ACCESS_KEY_ID=s3-admin-access-key
            AWS_SECRET_ACCESS_KEY=s3-admin-secret-key
            @ANSIBLE_PRIVATE_KEY_FILE=ssh-private-key
            S3_CLUSTER_ACCESS_KEY=s3-cluster-access-key
            S3_CLUSTER_SECRET_KEY=s3-cluster-secret-key
            LUKS_PASSPHRASE=luks-passphrase
            GRAFANA_ADMIN_PASSWORD=grafana-admin-password
            GRAFANA_SECRET_KEY=grafana-secret-key
            GRAFANA_DB_PASSWORD=grafana-db-password
            POSTGRES_SUPERUSER_PASSWORD=postgres-superuser-password
            POSTGRES_REPLICATION_PASSWORD=postgres-replication-password
            PATRONI_RESTAPI_PASSWORD=patroni-restapi-password
            WG_EASY_PASSWORD=wg-easy-password
            HEALTHCHECKS_PG_BACKUP_URL=healthchecks-pg-backup-url
            HEALTHCHECKS_HOST_URLS=healthchecks-host-urls
            @CADDY_DNS_KEY_FILE=caddy-dns-key
            @GAR_PULL_KEY_FILE=gar-pull-key
      - name: Inventory and pinned host keys from the cloud stack
        working-directory: infra/cloud
        run: |
          set -euo pipefail
          umask 077
          pulumi stack select prod
          pulumi stack output inventory >../../ansible/inventory/hosts.yml
          pulumi stack output knownHosts >../../ansible/inventory/known_hosts
          echo "ARCHIVE_BUCKET=$(pulumi stack output buckets --json | jq -r '."logs-archive"')" >>"$GITHUB_ENV"
      - name: Install every host
        working-directory: ansible
        env:
          ALPINE_RELEASE: ${{ needs.guard.outputs.alpine_release }}
          ALPINE_DIGEST: ${{ needs.guard.outputs.alpine_digest }}
        run: |
          set -euo pipefail
          ansible-galaxy collection install -r requirements.yml -p .collections >/dev/null
          # Our images' tags: the ones the images jobs just pushed or found.
          ../scripts/image-tag.sh --vars >image-tags.json
          cat image-tags.json
          # -vvv: the deploy log shows each task's arguments, results and SSH
          # traffic. no_log tasks stay hidden at any verbosity, and every
          # secret value this job read is masked.
          ansible-playbook -vvv playbooks/site.yml -e @image-tags.json
      - name: Verify
        env:
          ALPINE_RELEASE: ${{ needs.guard.outputs.alpine_release }}
        run: scripts/verify.sh "$ARCHIVE_BUCKET"
      - name: Remove keys
        if: always()
        run: rm -rf "${RUNNER_TEMP}/gcp-deployer.json" "${RUNNER_TEMP}/secrets" "${RUNNER_TEMP}/gcloud" ansible/inventory/known_hosts
